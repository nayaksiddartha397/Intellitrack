name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Python syntax check ──────────────────────────────────
  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check all Python files compile
        run: |
          python -m py_compile config.py
          python -m py_compile detector.py
          python -m py_compile zone_manager.py
          python -m py_compile event_logger.py
          python -m py_compile app.py
          echo "✓ All files passed syntax check"

  # ── Job 2: Docker build ──────────────────────────────────────────
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: intellitrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Push to Docker Hub (only on push to main) ─────────────
  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/intellitrack:latest