version: "3.9"

services:
  intellitrack:
    build:
      context: .
      dockerfile: Dockerfile
    image: intellitrack:latest
    container_name: intellitrack
    restart: unless-stopped

    ports:
      - "5000:5000"          # http://localhost:5000

    volumes:
      # Uploaded video files persist across container restarts
      - ./uploads:/app/uploads
      # SQLite event database persists across restarts
      - ./data:/app/data
      # socket.io client JS is downloaded once and cached
      - ./static:/app/static

    environment:
      - PYTHONUNBUFFERED=1

    # ── Webcam pass-through (Linux only) ─────────────────────────
    # Uncomment the two lines below to pass your webcam into the container.
    # On macOS use the Upload Video button instead — Docker Desktop
    # does not support /dev/video* device pass-through.
    #
    # devices:
    #   - /dev/video0:/dev/video0

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
